<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Insta Translate</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      background: #0b0d10;
      color: #e8eaed;
      font: 16px/1.35 system-ui, -apple-system, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .side { display: flex; flex-direction: column; gap: 12px; padding: 16px; min-height: 0; }
    .them { transform: rotate(180deg); }
    .feed { flex: 1; overflow-y: auto; font-size: clamp(22px, 5.5vw, 34px); font-weight: 600; }
    .feed p { color: #7d848e; margin-bottom: .5em; }
    .feed p:last-child { color: #fff; }
    .pick { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    select {
      align-self: center;
      font: inherit;
      color: inherit;
      background: #161a20;
      border: 1px solid #2a3038;
      border-radius: 999px;
      padding: 8px 16px;
    }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 16px; padding: 10px; border-block: 1px solid #1c2128; }
    .opt { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 20px; color: #9aa1ab; font-size: 14px; }
    .opt input { vertical-align: middle; margin-right: 6px; }
    .opt select { padding: 4px 10px; margin-left: 6px; }
    #go {
      font: 600 18px system-ui, sans-serif;
      color: #fff;
      background: #2563eb;
      border: 0;
      border-radius: 999px;
      padding: 14px 32px;
    }
    #go.on { background: #dc2626; }
    #status { color: #9aa1ab; font-size: 14px; }
  </style>
</head>
<body>
  <section class="side them">
    <div class="feed" id="theirFeed" aria-live="polite"></div>
    <div class="pick">
      <select id="their" aria-label="Idioma da outra pessoa"></select>
      <select id="theirVoice" aria-label="Voz da tradução para a outra pessoa">
        <option value="">Voz de quem fala</option>
        <option value="Kore">Voz de mulher</option>
        <option value="Charon">Voz de homem</option>
      </select>
    </div>
  </section>
  <div class="bar">
    <button id="go">Iniciar</button>
    <span id="status" role="status">Toque para começar</span>
    <div class="opt">
      <label><input type="checkbox" id="split"> Fone: você no direito, a outra pessoa no esquerdo</label>
      <label>Filtro de ruído
        <select id="noise">
          <option value="0">Desligado</option>
          <option value="8" selected>Normal</option>
          <option value="15">Forte (lugar barulhento)</option>
        </select>
      </label>
    </div>
  </div>
  <section class="side">
    <div class="feed" id="myFeed" aria-live="polite"></div>
    <div class="pick">
      <select id="mine" aria-label="Meu idioma"></select>
      <select id="myVoice" aria-label="Voz da tradução para você">
        <option value="">Voz de quem fala</option>
        <option value="Kore">Voz de mulher</option>
        <option value="Charon">Voz de homem</option>
      </select>
    </div>
  </section>
  <script type="module" src="app.js"></script>
</body>
</html>
